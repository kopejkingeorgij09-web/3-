name: Stormcore macOS DMG

on:
  workflow_dispatch:
    inputs:
      runner:
        type: choice
        default: macos-15-intel
        options: [macos-15-intel, macos-15, macos-latest]
  push:
    branches: [main]
    paths:
      - .github/workflows/build-dmg.yml
      - native/version.env
      - native/macos/**

permissions:
  contents: write

concurrency:
  group: stormcore-dmg

jobs:
  macos:
    runs-on: ${{ inputs.runner || 'macos-15-intel' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and verify universal DMG
        run: native/macos/build.sh native/out
      - name: Upload the DMG to this version's release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          source native/version.env
          tag="native-v$VERSION"
          dmg="native/out/Stormcore-$VERSION-macOS.dmg"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fxq "${dmg##*/}"; then
              gh release upload "$tag" "$dmg" --repo "$GITHUB_REPOSITORY"
            fi
          else
            gh release create "$tag" "$dmg" --target "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" \
              --title "Stormcore $VERSION" --notes "Нативная сборка для macOS. DMG не нотарифицирован Apple."
          fi
